<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="650" viewBox="0 0 1600 650"><style>
text{font-family:-apple-system,"SF Pro Text","Helvetica Neue",Arial,sans-serif;fill:#0F172A}
.mono{font-family:"SF Mono",Menlo,Consolas,monospace}.title{font-size:34px;font-weight:700}
.sub{font-size:20px;fill:#64748B}.lbl{font-size:16px;fill:#64748B}.tag{font-size:18px;font-weight:600;fill:#334155}
</style><defs>
<linearGradient id="agent"><stop stop-color="#6366F1"/><stop offset="1" stop-color="#8B5CF6"/></linearGradient>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#94A3B8"/></marker>
</defs><rect width="1600" height="650" fill="#FFFFFF"/><text x="70" y="75" text-anchor="start" class="title">The data graph connects the facts</text><text x="70" y="115" text-anchor="start" class="sub">One case, four records. Arrows describe relationships stored in BigQuery.</text><rect x="70" y="160" width="1460" height="440" rx="18" fill="#F8FAFC" fill-opacity=".6" stroke="#94A3B8" stroke-width="2" stroke-dasharray="8 6"/><text x="95" y="194" text-anchor="start" class="mono tag">BIGQUERY · RefundGraph</text><path d="M450 270 H660" fill="none" stroke="#94A3B8" stroke-width="2" marker-end="url(#arr)"/><text x="555" y="249" text-anchor="middle" class="mono lbl">PLACED</text><path d="M950 270 H1160" fill="none" stroke="#94A3B8" stroke-width="2" marker-end="url(#arr)"/><text x="1055" y="249" text-anchor="middle" class="mono lbl">HAS_PAYMENT</text><path d="M305 325 V445" fill="none" stroke="#94A3B8" stroke-width="2" marker-end="url(#arr)"/><text x="415" y="392" text-anchor="middle" class="mono lbl">HAS_HISTORY</text><g data-node="customer" role="button" tabindex="0" aria-label="Customer"><rect x="160" y="215" width="290" height="110" rx="14" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2"/><text x="305.0" y="249" text-anchor="middle" class="mono" font-size="20" style="fill:#0F172A">Customer</text><text data-value="customer-0" x="305.0" y="276" text-anchor="middle" font-size="16" style="fill:#0F172A;opacity:.78">Account age: 412 days</text></g><g data-node="order" role="button" tabindex="0" aria-label="Order A-1043"><rect x="660" y="215" width="290" height="110" rx="14" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2"/><text x="805.0" y="249" text-anchor="middle" class="mono" font-size="20" style="fill:#0F172A">Order A-1043</text><text data-value="order-0" x="805.0" y="276" text-anchor="middle" font-size="16" style="fill:#0F172A;opacity:.78">$62 · 12 days ago</text><text data-value="order-1" x="805.0" y="300" text-anchor="middle" font-size="16" style="fill:#0F172A;opacity:.78">Trail running shoes</text></g><g data-node="payment" role="button" tabindex="0" aria-label="Payment"><rect x="1160" y="215" width="290" height="110" rx="14" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2"/><text x="1305.0" y="249" text-anchor="middle" class="mono" font-size="20" style="fill:#0F172A">Payment</text><text data-value="payment-0" x="1305.0" y="276" text-anchor="middle" font-size="16" style="fill:#0F172A;opacity:.78">Visa · settled</text><text data-value="payment-1" x="1305.0" y="300" text-anchor="middle" font-size="16" style="fill:#0F172A;opacity:.78">No open chargeback</text></g><g data-node="history" role="button" tabindex="0" aria-label="Refund history"><rect x="160" y="445" width="290" height="100" rx="14" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2"/><text x="305.0" y="479" text-anchor="middle" class="mono" font-size="20" style="fill:#0F172A">Refund history</text><text data-value="history-0" x="305.0" y="506" text-anchor="middle" font-size="16" style="fill:#0F172A;opacity:.78">1 prior refund · 12 months</text></g><text x="660" y="470" text-anchor="start" class="sub">Start at the order. Follow its payment,</text><text x="660" y="502" text-anchor="start" class="sub">then its customer&#x27;s history summary.</text><text x="660" y="548" text-anchor="start" class="lbl">No prior transaction details were invented.</text></svg>