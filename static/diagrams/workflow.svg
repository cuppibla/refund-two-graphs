2"/><text x="1160.0" y="364" text-anchor="middle" class="mono" font-size="20" style="fill:#92400E">⏸ Review</text><text data-value="human_review-0" x="1160.0" y="391" text-anchor="middle" font-size="16" style="fill:#92400E;opacity:.78">Pause for input</text></g><path d="M860 330 V209 H1310" fill="none" stroke="#94A3B8" stroke-width="2" marker-end="url(#arr)"/><text x="1100" y="190" text-anchor="middle" class="mono lbl">AUTO_APPROVE</text><path d="M860 418 V544 H1310" fill="none" stroke="#94A3B8" stroke-width="2" marker-end="url(#arr)"/><text x="1100" y="525" text-anchor="middle" class="mono lbl">DENY</text><path d="M1260 374 H1285 V209 H1310" fill="none" stroke="#94A3B8" stroke-width="2" marker-end="url(#arr)" stroke-dasharray="7 5"/><text x="1300" y="285" text-anchor="middle" class="mono lbl">approve</text><path d="M1285 374 V544 H1310" fill="none" stroke="#94A3B8" stroke-width="2" marker-end="url(#arr)" stroke-dasharray="7 5"/><text x="1300" y="465" text-anchor="middle" class="mono lbl">decline</text><g data-node="approve_notice" role="button" tabindex="0" aria-label="Approval draft"><rect x="1310" y="165" width="220" height="88" rx="14" fill="url(#agent)" stroke="#8B5CF6" stroke-width="2"/><text x="1420.0" y="199" text-anchor="middle" class="mono" font-size="20" style="fill:#FFFFFF">✦ Approval draft</text><text data-value="approve_notice-0" x="1420.0" y="226" text-anchor="middle" font-size="16" style="fill:#FFFFFF;opacity:.78">Selected model node</text></g><g data-node="denial_notice" role="button" tabindex="0" aria-label="Decline draft"><rect x="1310" y="500" width="220" height="88" rx="14" fill="url(#agent)" stroke="#8B5CF6" stroke-width="2"/><text x="1420.0" y="534" text-anchor="middle" class="mono" font-size="20" style="fill:#FFFFFF">✦ Decline draft</text><text data-value="denial_notice-0" x="1420.0" y="561" text-anchor="middle" font-size="16" style="fill:#FFFFFF;opacity:.78">Selected model node</text></g><rect x="70" y="668" width="13" height="13" rx="3" fill="#FFFFFF" stroke="#F59E0B"/><text x="92" y="680" text-anchor="start" class="" font-size="14" style="fill:#64748B">Data record</text><rect x="240" y="668" width="13" height="13" rx="3" fill="#FFFFFF" stroke="#94A3B8"/><text x="262" y="680" text-anchor="start" class="" font-size="14" style="fill:#64748B">Function</text><rect x="410" y="668" width="13" height="13" rx="3" fill="#FFFFFF" stroke="#10B981"/><text x="432" y="680" text-anchor="start" class="" font-size="14" style="fill:#64748B">Policy</text><rect x="580" y="668" width="13" height="13" rx="3" fill="#FFFBEB" stroke="#F59E0B"/><text x="602" y="680" text-anchor="start" class="" font-size="14" style="fill:#64748B">Reviewer</text><rect x="750" y="668" width="13" height="13" rx="3" fill="url(#agent)" stroke="#8B5CF6"/><text x="772" y="680" text-anchor="start" class="" font-size="14" style="fill:#64748B">Model</text><text x="70" y="720" text-anchor="start" class="lbl">The original $62 case takes the review branch. A decision does not execute a payment.</text></svg>