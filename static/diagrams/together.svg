" stroke="#8B5CF6"/><text x="772" y="855" text-anchor="start" class="" font-size="14" style="fill:#64748B">Model</text><text x="70" y="895" text-anchor="start" class="lbl">Data edges connect records. Workflow edges connect steps. The query is where the two meet.</text></svg>